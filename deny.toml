[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
    # rustybuzz and ttf-parser are unmaintained. They arrive via usvg/resvg 0.45 and
    # fontdb 0.23, used only by lens's OG renderer (crates/lens/src/og/) with bundled
    # fonts; rustybuzz shapes the rendered text. The caller-controlled text is the
    # domain, validated by lens's input parser, and the OG `label` query parameter
    # (printable ASCII 0x20-0x7E, at most 32 bytes; crates/lens/src/og/handler.rs,
    # pinned by crates/lens/tests/og_label_bounds.rs). resvg 0.48 and fontdb 0.24 drop
    # both crates; the bump follows in this feature's Phase 3.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
    # paste is unmaintained; it arrives via utoipa-axum, used by lens, and is a
    # build-time proc-macro only.
    "RUSTSEC-2024-0436",
    # hickory-proto is fixed in hickory-proto and hickory-net 0.26.1 and later; we wait
    # for mhost 0.12.0 (next phase). The NSEC3 loop (RUSTSEC-2026-0118) needs a
    # validating DnssecDnsHandle, which mhost does not configure and prism's raw DNSSEC
    # queries do not use. The name compression issue (RUSTSEC-2026-0119) hits encoding,
    # and only our own small queries are encoded.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
