[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
    # rustls-pemfile is unmaintained (RUSTSEC-2025-0134); no safe upgrade available,
    # it is a transitive dependency via the rustls ecosystem. Tracked for removal.
    "RUSTSEC-2025-0134",
    # paste is unmaintained (RUSTSEC-2024-0436); transitive dependency, no
    # drop-in replacement available yet. Tracked for future removal.
    "RUSTSEC-2024-0436",
    # rsa Marvin Attack timing sidechannel (RUSTSEC-2023-0071); transitive via
    # sqlx-mysql, pulled into the lockfile by sqlx's macros/migrate features
    # even though we only use the sqlite backend. No patched rsa release
    # available; the rsa code is never executed at runtime.
    "RUSTSEC-2023-0071",
    # Deferred by operator decision on 2026-10-08: ship 0.22.x first, fix these next.
    # Recorded in the planning repo's SDD (monorepo, Phase 4 progress). Remove each line
    # with its fix.
    # hickory-proto NSEC3 unbounded loop (no fixed release) and O(n²) name compression
    # (fixed in 0.26); arrives via mhost 0.11.3, which pins hickory 0.25.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # time stack exhaustion; fixed in 0.3.47 (cargo update -p time).
    "RUSTSEC-2026-0009",
    # lru LruCache::pop unsound; fixed in 0.18.2 (direct dependency of ifconfig-rs).
    "RUSTSEC-2026-0253",
    # rustybuzz and ttf-parser unmaintained; no replacement crate.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
