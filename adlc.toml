# adlc.toml — what this repository declares, and what the gate can therefore check.

# The contract: the one recipe in the justfile that runs the suite.
[contract]
recipe = "adlc-verify"

[exceptions]
# tests/acceptance is Playwright against the deployed services (`just acceptance`), not part of the gate.
not-tests = ["tests/acceptance/**"]

# Command names the contract calls; `adlc audit` reports the ones missing on this machine.
[tools]
required = ["cargo", "node", "npm", "bash"]

[principles]
P03 = { sentence = "One status vocabulary and one name set across engine, API and UI: a check status is the engine's type, the product is netray, a detail tool is an inspector; lens and the codenames do not reach UI copy or API output", procedure = "sg for enum declarations named *Status or *Verdict outside the netray-model crate; rg -i for lens, prism, tlsight, spectra, beacon in templates, site/ and API serializers" }
P10 = { sentence = "Errors, timeouts, a section with no weighted check and not-tested-from-here make a result incomplete, never pass; only N/A by design (no MX, Null MX) is excluded without that (security-correctness SC12, SC14)", procedure = "for each changed check or scoring path, follow every error and timeout branch to the verdict it produces and check none reaches Pass or N/A" }
P12 = { sentence = "Every outbound call and every module run inside the engine carries a deadline, and the hard deadline keeps the sections that finished (SC8; a reqwest timeout is BackendError::Timeout)", procedure = "sg for reqwest client builders and engine module entry calls; each names a timeout or runs under the section deadline" }
P13 = { sentence = "In the one netray process, domain runs, each inspector and the API have their own concurrency limit, so a slow inspector or a flood of re-checks cannot starve the result page", procedure = "read the limiter setup of the serve command; one limiter per consumer, and a new route is attached to one" }
P18 = { sentence = "Every user-controlled outbound fetch goes through netray_common::fetch and is refused unless the target is public; every config struct rejects unknown keys", procedure = "sg for reqwest::Client constructions outside crates/common/src/fetch.rs; tests/repo/test_config_strict.sh is green" }
P26 = { sentence = "Every fact is computed by one module and referenced elsewhere, and every check ID is emitted by exactly one module (CAA, HSTS, MX and IP reputation are computed once)", procedure = "rg -n for each new check ID under crates/ hits one emitter; no second fetch or lookup of a fact another module already records" }
P35 = { sentence = "A quality the architecture must keep has a test that holds it: the token and component gate (PRD R45), the tests/repo checks, the contract goldens; no hand-kept compliance tracker", procedure = "a new or changed rule in specs/rules/ arrives with the tests/repo check or gate test that enforces it" }
P36 = { sentence = "Derived artefacts are generated by a just recipe from one source: CSS tokens from v2-tokens.json, the compare page's own column from the check catalogue, the sitemap from site/; none is edited by hand", procedure = "git diff --stat: a generated file changes only together with its source or its generator" }
P40 = { sentence = "The engine knows its check modules only through one trait and a registry, never their concrete crates; a module (dns, tls, http, email, ip, later registration health) is added or removed with a bounded, stated set of edits outside it", procedure = "git diff --stat of a change that adds or removes a module: outside the module only the registry, the scoring profile and the check catalogue change; sg in the engine crate for use of a module crate path other than the registry" }
