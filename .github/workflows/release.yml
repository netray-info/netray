name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::release runs only from a tag ref, not from $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::ref '$GITHUB_REF_NAME' is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the image tag exists
        run: |
          ref="ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}"
          if out=$(docker manifest inspect "$ref" 2>&1); then
            echo "::error::$ref already exists; tags are never overwritten"
            exit 1
          fi
          if ! grep -qiE 'manifest unknown|not found|no such manifest' <<<"$out"; then
            echo "::error::cannot tell whether $ref exists: $out"
            exit 1
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}

      - name: Smoke-test netray serve on every host
        run: |
          image="ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}"
          failed=0

          check() {
            local name="$1" host="$2" path="$3" i
            for i in $(seq 1 30); do
              if docker exec "$name" wget -qO- --header "Host: $host" "http://127.0.0.1:8080$path" >/dev/null 2>&1; then
                echo "ok: $host $path"
                return 0
              fi
              sleep 1
            done
            echo "::error::$host did not answer $path within 30 s"
            docker logs "$name" 2>&1 | tail -n 20
            return 1
          }

          # One process serves every host by Host; the store lives in the container's /tmp.
          docker run -d --name smoke-serve \
            -e NETRAY_SERVER__BIND=127.0.0.1:8080 -e NETRAY_SERVER__METRICS_BIND=127.0.0.1:9090 \
            -e NETRAY_STORE__DB_PATH=/tmp/history.db \
            "$image" >/dev/null
          # /health answers before host routing; / tells the hosts apart (an unknown host is 404).
          for host in netray.info dns.netray.info tls.netray.info http.netray.info ip.netray.info; do
            check smoke-serve "$host" /health || failed=1
            check smoke-serve "$host" / || failed=1
          done
          docker rm -f smoke-serve >/dev/null

          exit "$failed"

      - name: Image carries no data files
        run: |
          found=$(docker run --rm --user 0 --entrypoint sh "ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}" \
            -ec 'find / -xdev -name "*.mmdb"; if [ -d /netray/data ]; then find /netray/data -type f; fi')
          if [ -n "$found" ]; then
            echo "::error::the image must not contain data files (GeoLite2 licence):"
            echo "$found"
            exit 1
          fi

      - name: Published layers carry no data files
        run: |
          dir="$RUNNER_TEMP/image-layers"
          mkdir -p "$dir"
          docker save "ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}" | tar -x -C "$dir"
          layers=0
          found=""
          while IFS= read -r f; do
            if listing=$(tar -tf "$f" 2>/dev/null); then
              layers=$((layers + 1))
              hits=$(printf '%s\n' "$listing" | grep -E '(^|/)[^/]+\.mmdb$|^(\./)?netray/data/.' || true)
              [ -z "$hits" ] || found="$found$hits"$'\n'
            fi
          done < <(find "$dir" -type f ! -name '*.json' ! -name oci-layout ! -name repositories)
          if [ "$layers" -eq 0 ]; then
            echo "::error::no image layer found to scan"
            exit 1
          fi
          if [ -n "$found" ]; then
            echo "::error::the published layers contain data files (GeoLite2 licence):"
            echo "$found"
            exit 1
          fi
          echo "scanned $layers layers: no data files"

      - name: Publish the image
        run: docker push "ghcr.io/netray-info/netray:${{ steps.version.outputs.version }}"
