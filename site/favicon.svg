<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f1117"/>

  <!-- Outer radar ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6b8db5" stroke-width="1.5" opacity="0.25"/>

  <!-- Middle ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#6b8db5" stroke-width="1.5" opacity="0.45"/>

  <!-- Sweep ray -->
  <line x1="16" y1="16" x2="25" y2="8" stroke="#dce6f5" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Sweep glow arc -->
  <path d="M16 5 A11 11 0 0 1 27 16" fill="none" stroke="#dce6f5" stroke-width="1.5" opacity="0.2"/>

  <!-- Center node -->
  <circle cx="16" cy="16" r="2.5" fill="#dce6f5"/>

  <!-- Signal dots -->
  <circle cx="21" cy="10" r="1.2" fill="#6b8db5" opacity="0.6"/>
  <circle cx="11" cy="20" r="1" fill="#6b8db5" opacity="0.4"/>
</svg>
