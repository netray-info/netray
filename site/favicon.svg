<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f1117"/>

  <!-- Incoming parallel rays (left) -->
  <line x1="1" y1="10" x2="10" y2="13.5" stroke="#6b8db5" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="1" y1="16" x2="9"  y2="16"   stroke="#6b8db5" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <line x1="1" y1="22" x2="10" y2="18.5" stroke="#6b8db5" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Biconvex lens -->
  <path d="M10 16 C10 9.5 13 6.5 16 6.5 C19 6.5 22 9.5 22 16 C22 22.5 19 25.5 16 25.5 C13 25.5 10 22.5 10 16 Z"
        fill="none" stroke="#dce6f5" stroke-width="1.5" opacity="0.75"/>

  <!-- Focal point / center glow -->
  <circle cx="16" cy="16" r="2.2" fill="#dce6f5"/>
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#dce6f5" stroke-width="0.75" opacity="0.3"/>

  <!-- Outgoing focused rays (right) -->
  <line x1="22" y1="13.5" x2="31" y2="10"  stroke="#dce6f5" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="23" y1="16"   x2="31" y2="16"  stroke="#dce6f5" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="22" y1="18.5" x2="31" y2="22"  stroke="#dce6f5" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
</svg>
