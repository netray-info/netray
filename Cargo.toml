[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.23.0"
edition = "2024"

[workspace.dependencies]
netray-common = { path = "crates/common" }

# Web framework
axum = "0.8"
axum-extra = "0.12"
tower = "0.5"
tower-http = "0.6"
governor = "0.10"
http-body-util = "0.1"

# HTTP client
reqwest = { version = "0.13", default-features = false }

# DNS
mhost = { version = "=0.12.0", default-features = false }

# Async runtime
tokio = "1"
tokio-stream = "0.1"
futures = "0.3"

# Serialization and configuration
serde = "1"
serde_json = "1"
config = "0.15"
toml = "1"

# Errors, logging, metrics
thiserror = "2"
anyhow = "1"
tracing = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Embedded frontend and OpenAPI
rust-embed = "8"
mime_guess = "2"
utoipa = "5"

# Shared utilities
moka = "0.12"
arc-swap = "1"
uuid = "1"
regex = "1"
chrono = { version = "0.4", default-features = false }
percent-encoding = "2"
url = "2"
ip_network = "0.4"
