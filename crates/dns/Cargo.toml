[package]
name = "netray-dns"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The DNS module and inspector of netray, powered by mhost"

[dependencies]
netray-model = { workspace = true }
netray-engine = { workspace = true }
mhost = { workspace = true, features = ["dot", "doh"] }
netray-common = { workspace = true, features = ["schema", "enrichment", "fetch"] }

# Web framework
axum = { workspace = true, features = ["json"] }
governor = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# DNS (used by the trace delegation walk)
hickory-proto = { workspace = true, features = ["dnssec-ring"] }
rand = "0.10"
psl = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Dates (SOA serial age)
chrono = { workspace = true, features = ["clock"] }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# Result caching
moka = { workspace = true, features = ["future"] }

# Request IDs
uuid = { workspace = true, features = ["v4", "v7"] }

# OpenAPI
utoipa = { workspace = true }

[features]
testing = []

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

[[test]]
name = "module_v3"
path = "tests/module_v3.rs"
required-features = ["testing"]

[[test]]
name = "ns_timeouts"
path = "tests/ns_timeouts.rs"
required-features = ["testing"]

[[test]]
name = "contract_status"
path = "tests/contract_status.rs"
required-features = ["testing"]

[[test]]
name = "unmeasured_inputs"
path = "tests/unmeasured_inputs.rs"
required-features = ["testing"]

[[test]]
name = "jobs"
path = "tests/jobs.rs"
required-features = ["testing"]

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
toml = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
tokio = { workspace = true, features = ["full", "test-util"] }

[[test]]
name = "job_blocks"
path = "tests/job_blocks.rs"
required-features = ["testing"]

[[test]]
name = "job_blocks_review"
path = "tests/job_blocks_review.rs"
required-features = ["testing"]

[[test]]
name = "job_blocks_rule_m"
path = "tests/job_blocks_rule_m.rs"
required-features = ["testing"]

[[test]]
name = "job_blocks_rendering"
path = "tests/job_blocks_rendering.rs"
required-features = ["testing"]
