[package]
name = "netray-http"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The HTTP module and inspector of netray: headers and security audit"

[dependencies]
netray-model = { workspace = true }
netray-engine = { workspace = true }
# Web framework
axum = { workspace = true, features = ["json"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "enrichment", "fetch"] }

# HTTP client for outbound inspection requests
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots", "http2", "stream"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Ordered maps for header dumps
indexmap = { version = "2", features = ["serde"] }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }

# Date/time
chrono = { workspace = true, features = ["serde", "clock"] }

# URL parsing
url = { workspace = true }

[features]
testing = []

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

[dev-dependencies]
toml = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "job"
path = "tests/job.rs"
required-features = ["testing"]
