[package]
name = "netray-email"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Email security inspector for netray.info — DNS-only mail posture analysis"

[dependencies]
netray-model = { workspace = true }
netray-engine = { workspace = true }
# Web framework
axum = { workspace = true, features = ["json"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "enrichment", "fetch"] }

# HTTP client (MTA-STS policy, BIMI logo)
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots", "http2"] }

# DNS
mhost = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
tokio-stream = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# IP networks (SPF CIDR sets)
ipnet = "2"

# DKIM key parsing
x509-parser = "0.17"
base64 = { workspace = true }

# URL parsing (BIMI logo scheme validation)
url = { workspace = true }

# Loopback TLS listener serving a recorded MTA-STS policy (testing::from_evidence).
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", optional = true }

[features]
testing = ["dep:rcgen", "dep:rustls", "dep:tokio-rustls"]

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

[[test]]
name = "unmeasured_outcomes"
path = "tests/unmeasured_outcomes.rs"
required-features = ["testing"]

[[test]]
name = "contract_status"
path = "tests/contract_status.rs"
required-features = ["testing"]

[[test]]
name = "unmeasured_partial"
path = "tests/unmeasured_partial.rs"
required-features = ["testing"]

[[test]]
name = "partial_address_lookups"
path = "tests/partial_address_lookups.rs"
required-features = ["testing"]

[[test]]
name = "partial_address_findings"
path = "tests/partial_address_findings.rs"
required-features = ["testing"]

[[test]]
name = "spf_nested_errors"
path = "tests/spf_nested_errors.rs"
required-features = ["testing"]

[[test]]
name = "spf_exists"
path = "tests/spf_exists.rs"
required-features = ["testing"]

[[test]]
name = "spf_exists_qualifier"
path = "tests/spf_exists_qualifier.rs"
required-features = ["testing"]

[[test]]
name = "spf_info_only"
path = "tests/spf_info_only.rs"
required-features = ["testing"]

[[test]]
name = "evidence"
path = "tests/evidence.rs"
required-features = ["testing"]

[[test]]
name = "evidence_reading"
path = "tests/evidence_reading.rs"
required-features = ["testing"]

[[test]]
name = "dnsbl_domain"
path = "tests/dnsbl_domain.rs"
required-features = ["testing"]

[[test]]
name = "job"
path = "tests/job.rs"
required-features = ["testing"]

[dev-dependencies]
toml = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# Raw DNS messages for the loopback responder (tests/it/resolver_tcp_retry.rs).
hickory-proto = { workspace = true }
# Loopback TLS listener for the MTA-STS results table (checks/mta_sts_results_table.rs).
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
