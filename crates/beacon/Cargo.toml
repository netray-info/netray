[package]
name = "beacon"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Email security inspector for netray.info — DNS-only mail posture analysis"

[dependencies]
# Web framework
axum = { workspace = true, features = ["json", "macros"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["compression-gzip", "trace", "limit"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment", "backend"] }

# HTTP client (MTA-STS policy, BIMI logo)
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots", "http2"] }

# DNS
mhost = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
pin-project-lite = "0.2"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# Embedded frontend
rust-embed = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }

# IP networks (SPF CIDR sets)
ipnet = "2"

# DKIM key parsing
x509-parser = "0.17"
base64 = "0.22"

# Percent-decoding for path params
percent-encoding = { workspace = true }

# URL parsing (BIMI logo scheme validation)
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# HTTP mock server for the enrichment integration test (per project-review SDD Req 12).
wiremock = "0.6"
