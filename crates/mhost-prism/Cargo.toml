[package]
name = "prism"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Web-based DNS debugging service powered by mhost"

[dependencies]
mhost = { workspace = true, features = ["dot", "doh"] }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment-cache", "backend"] }

# Web framework
axum = { workspace = true, features = ["json"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
governor = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# DNS (used by the trace delegation walk)
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
rand = "0.10"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Embedded frontend
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# Result caching
moka = { workspace = true, features = ["future"] }

# Hot config reload
arc-swap = { workspace = true }

# HTTP client (MTA-STS policy file fetch)
reqwest = { workspace = true, features = ["rustls", "webpki-roots"] }

# Request IDs
uuid = { workspace = true, features = ["v7"] }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
