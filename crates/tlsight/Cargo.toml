[package]
name = "tlsight"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Web-based TLS certificate inspection and diagnostics service"

[dependencies]
# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "1"
x509-parser = { version = "0.18", features = ["verify"] }
x509-ocsp = "0.2"
x509-cert = "0.2"
spki = "0.7"

# DNS
mhost = { workspace = true }

# Crypto
sha2 = "0.11"
sha1 = "0.11"
der = "0.7"

# Time
time = "0.3"

# Web framework
axum = { workspace = true, features = ["json"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment", "backend"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }
arc-swap = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Embedded frontend
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }

# Date/time for cert handling
chrono = { workspace = true, features = ["serde", "clock"] }

# Percent-decoding for URL params
percent-encoding = { workspace = true }

# HTTP client (readiness probe to enrichment service)
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots"] }


[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
rcgen = "0.14"
serde_json = { workspace = true }
