last_reviewed = "2026-05-09"
intro = "netray is a unified domain health checker — one URL, five axes, one grade. This page helps you decide which tool fits your needs: netray for breadth, or a specialist for depth. The depth gaps are admitted, not papered over."
methodology = "Feature claims about each tool were verified against vendor documentation and hands-on checks using example.com as the test domain. Where documentation was ambiguous, the tool was queried directly and results were observed. This page is reviewed quarterly; the date above reflects the most recent verification pass."
legend = [
  { symbol = "✓", text = "full coverage" },
  { symbol = "~", text = "partial or lower depth" },
  { symbol = "✗", text = "not done" },
  { symbol = "—", text = "out of scope for that tool" },
]

[honesty]
title = "Where netray trades depth for breadth"
lede = "netray covers five axes in one query. Specialists go deeper on each axis. Here are the three gaps that matter most."
paragraphs = [
  { lead = "SSL Labs", text = "covers StartTLS on SMTP ports 25, 465, and 587, runs full cipher-suite enumeration with downgrade tests (POODLE, BEAST, RC4), and checks a broader set of handshake variants that the TLS inspector does not yet test. For a mail server's TLS posture, SSL Labs gives a more authoritative grade." },
  { lead = "hardenize", text = "includes additional email-edge checks such as BIMI VMC chain validation and variant MTA-STS report parsing that netray's email checks do not yet replicate. Its certificate-monitoring subscription tracks expiry across all your domains, not just on-demand checks." },
  { lead = "mxtoolbox", text = "carries 20+ years of mail-flow heuristics — blacklist reputation across 100+ lists, live SMTP banner testing, and delivery-path tracing — that netray's email checks do not yet replicate." },
]

