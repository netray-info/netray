[package]
name = "netray-web"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Templates, components and design tokens for the netray.info V2 suite"

[dependencies]
netray-common = { workspace = true, features = ["schema"] }
netray-model = { workspace = true }
netray-engine = { workspace = true }
netray-store = { workspace = true }
netray-ip = { workspace = true }
netray-tls = { workspace = true }
netray-http = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true, features = ["axum"] }
governor = { workspace = true }
futures = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
psl = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tracing-subscriber = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
futures = { workspace = true }
jsonschema = { version = "0.30", default-features = false }
netray-ip = { workspace = true, features = ["testing"] }
netray-tls = { workspace = true, features = ["testing"] }
netray-http = { workspace = true, features = ["testing"] }
