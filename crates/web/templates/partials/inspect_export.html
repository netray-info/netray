<div class="inspector-export" id="inspect-export" data-filename="{{ filename }}"><button type="button" class="inspector-export__copy" data-export-action="markdown"{% if exports.is_none() %} disabled{% endif %} hidden>Copy Markdown</button><button type="button" class="inspector-export__download" data-export-action="csv"{% if exports.is_none() %} disabled{% endif %} hidden>CSV</button><button type="button" class="inspector-export__download" data-export-action="json"{% if exports.is_none() %} disabled{% endif %} hidden>JSON</button><span class="inspector-export__status" role="status" aria-live="polite"></span>{% if let Some((markdown, csv, json)) = exports %}<template data-export="markdown">{{ markdown|safe }}</template><template data-export="csv">{{ csv|safe }}</template><template data-export="json">{{ json|safe }}</template>{% endif %}</div>
