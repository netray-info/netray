<header id="result-header">
{{ grade|safe }}
<h1>{{ domain }}</h1>
{{ run_line|safe }}
{{ progress|safe }}
<form id="recheck" class="recheck" method="post" action="/{{ href }}/run" data-island="stream" data-stream-url="/{{ href }}/run"{% if autostart %} data-stream-autostart="visit"{% endif %}>
{{ button|safe }}
{%- if let Some(selectors) = dkim_selectors %}
<input type="hidden" name="dkim_selectors" value="{{ selectors }}">{% endif %}
</form>
{{ share|safe }}
</header>
