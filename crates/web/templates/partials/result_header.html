<header id="result-header" class="result-hero">
{{ grade|safe }}
<div class="result-hero__title">
{{ run_line|safe }}
<h1>{% for label in domain.split('.') %}{% if !loop.first %}<wbr>{% endif %}<span class="result-hero__label">{{ label }}{% if !loop.last %}.{% endif %}</span>{% endfor %}</h1>
{{ progress|safe }}
</div>
<div class="result-hero__actions">
<form id="recheck" class="recheck" method="post" action="/{{ href }}/run" data-island="stream" data-stream-url="/{{ href }}/run"{% if autostart %} data-stream-autostart="visit"{% endif %}>
{{ button|safe }}
{%- if let Some(selectors) = dkim_selectors %}
<input type="hidden" name="dkim_selectors" value="{{ selectors }}">{% endif %}
</form>
{{ share|safe }}
</div>
</header>
