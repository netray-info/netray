<figure id="spectrum" data-island="spectrum"{% if refreshing %} data-refreshing{% endif %}>
{{ plate|safe }}
<p id="spectrum-gutter" aria-live="polite"></p>
<p id="spectrum-sentence" aria-live="polite"></p>
{% if stepper %}
<div id="spectrum-stepper">
<button type="button" data-step="-1" aria-label="newer run">&lsaquo;</button>
<button type="button" data-step="1" aria-label="older run">&rsaquo;</button>
</div>
{% endif %}
<div id="trace">{{ trace|safe }}</div>
<div class="legend-row">
<ul id="legend">
<li><span class="legend__mark" data-tone="pass"></span>pass</li>
<li><span class="legend__mark" data-tone="warn"></span>warn</li>
<li><span class="legend__mark" data-tone="fail"></span>fail</li>
{% if let Some(since) = legend.fixed_since %}<li><span class="legend__mark" data-tone="fix"></span>fixed since {{ since }}</li>
{% endif %}</ul>
{% if legend.checks > 0 %}<span class="legend__note">{{ legend.checks }} checks · line height = weight in the grade</span>
{% endif %}
</div>
<ul id="spectrum-sentences" hidden>
{% for (code, sentence) in sentences %}
<li data-code="{{ code }}" data-sentence="{{ sentence }}"></li>
{% endfor %}
</ul>
</figure>
