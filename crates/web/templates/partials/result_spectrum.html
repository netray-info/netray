<figure id="spectrum" data-island="spectrum"{% if refreshing %} data-refreshing{% endif %}>
{{ plate|safe }}
<p id="spectrum-gutter" aria-live="polite"></p>
<p id="spectrum-sentence" aria-live="polite"></p>
{% if stepper %}
<div id="spectrum-stepper">
<button type="button" data-step="-1" aria-label="newer run">&lsaquo;</button>
<button type="button" data-step="1" aria-label="older run">&rsaquo;</button>
</div>
{% endif %}
<div id="trace">{{ trace|safe }}</div>
<ul id="legend">
<li>pass</li>
<li>warn</li>
<li>fail</li>
<li>fixed</li>
<li>muted</li>
</ul>
<ul id="spectrum-sentences" hidden>
{% for (code, sentence) in sentences %}
<li data-code="{{ code }}" data-sentence="{{ sentence }}"></li>
{% endfor %}
</ul>
</figure>
