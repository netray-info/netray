<div id="result-share">{% if let Some(id) = id %}<a id="share" class="button button--secondary" href="/r/{{ id }}" data-island="share" aria-haspopup="dialog">Share</a><dialog id="share-dialog" class="share-dialog" aria-labelledby="share-dialog-title"><h2 id="share-dialog-title">Share and embed</h2><button type="button" class="share-dialog__close" aria-label="Close">&times;</button><div class="share-dialog__tabs" role="tablist"><button type="button" role="tab" class="marker share-dialog__tab" id="share-tab-snapshot" aria-selected="true" aria-controls="share-snapshot">Snapshot</button><button type="button" role="tab" class="marker share-dialog__tab" id="share-tab-rerun" aria-selected="false" aria-controls="share-rerun">Re-run link</button><button type="button" role="tab" class="marker share-dialog__tab" id="share-tab-badge" aria-selected="false" aria-controls="share-badge">Badge</button><button type="button" role="tab" class="marker share-dialog__tab" id="share-tab-card" aria-selected="false" aria-controls="share-card">Social card</button></div>
<div role="tabpanel" id="share-snapshot" class="share-dialog__panel" aria-labelledby="share-tab-snapshot"><div class="share-dialog__row"><input id="share-snapshot-url" class="share-dialog__field" readonly value="{{ snapshot }}"><button type="button" class="button button--secondary share-dialog__copy" data-copy="share-snapshot-url" aria-live="polite">Copy</button></div></div>
<div role="tabpanel" id="share-rerun" class="share-dialog__panel" aria-labelledby="share-tab-rerun" hidden><div class="share-dialog__row"><input id="share-rerun-url" class="share-dialog__field" readonly value="{{ rerun }}"><button type="button" class="button button--secondary share-dialog__copy" data-copy="share-rerun-url" aria-live="polite">Copy</button></div></div>
<div role="tabpanel" id="share-badge" class="share-dialog__panel" aria-labelledby="share-tab-badge" hidden><div class="share-dialog__styles"><label><input type="radio" name="badge-style" value="flat" checked data-markdown="{{ md_flat }}" data-html="{{ html_flat|safe }}"> flat</label><label><input type="radio" name="badge-style" value="for-the-badge" data-markdown="{{ md_big }}" data-html="{{ html_big|safe }}"> for-the-badge</label></div><div class="share-dialog__row"><textarea id="share-badge-md" class="share-dialog__field" rows="2" readonly>{{ md_flat }}</textarea><button type="button" class="button button--secondary share-dialog__copy" data-copy="share-badge-md" aria-live="polite">Copy</button></div><div class="share-dialog__row"><textarea id="share-badge-html" class="share-dialog__field" rows="2" readonly>{{ html_flat|safe }}</textarea><button type="button" class="button button--secondary share-dialog__copy" data-copy="share-badge-html" aria-live="polite">Copy</button></div><div class="share-dialog__preview"><img class="share-dialog__badge" data-src="/badge/{{ domain }}.svg" alt="netray grade badge for {{ domain }}"></div></div>
<div role="tabpanel" id="share-card" class="share-dialog__panel" aria-labelledby="share-tab-card" hidden><div class="share-dialog__row"><input id="share-card-url" class="share-dialog__field" readonly value="{{ card }}"><button type="button" class="button button--secondary share-dialog__copy" data-copy="share-card-url" aria-live="polite">Copy</button></div><div class="share-dialog__preview"><img class="share-dialog__card" data-src="/r/{{ id }}/og.png" alt="Social card for {{ domain }}"></div></div></dialog>{% endif %}</div>
