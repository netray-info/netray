# netray.toml: the one configuration of `netray serve`. Every key is shown at its default,
# commented; uncomment to change. `NETRAY_<TABLE>__<KEY>` overrides a key, `NETRAY_CONFIG` names
# this file. Check a file with `netray serve --check-config <path>`.

[server]
# bind = "0.0.0.0:8082"
# metrics_bind = "127.0.0.1:9090"    # keep this address off the public network
# trusted_proxies = []
# apex = "netray.info"

[engine]
# resolve_timeout_ms = 1500          # must stay below the [modules.ip], [modules.tls] and [modules.http] deadline_ms
# profile_path = "profile.toml"      # unset: the built-in scoring profile

[store]
# enabled = true
# db_path = "history.db"

[admission]
# client_budget_per_hour = 30
# domain_run_slots = 8
# per_ip_per_minute = 10
# per_ip_burst = 3
# global_per_minute = 100
# global_burst = 20
# cache_enabled = true
# cache_window_seconds = 300

[badges]
# enabled = true
# ttl_seconds = 3600
# default_label = "lens"
# max_label_len = 32

[og_cards]
# enabled = true

[api]
# enabled = true                     # false: no /api/v1 routes
# per_ip_per_minute = 60             # the read endpoints, per client
# per_ip_burst = 10

[api.dns]
# per_ip_per_minute = 120
# per_ip_burst = 64                  # bursts must stay at or above 18, the smallest job's cost
# per_target_per_minute = 60
# per_target_burst = 20
# global_per_minute = 1000
# global_burst = 50
# per_ip_max_streams = 10

[api.tls]
# per_ip_per_minute = 30
# per_ip_burst = 10
# per_target_per_minute = 60
# per_target_burst = 20

[api.http]
# per_ip_per_minute = 10
# per_ip_burst = 5
# per_target_per_minute = 30
# per_target_burst = 10

[api.email]
# per_ip_per_minute = 10
# per_ip_burst = 10
# max_concurrent_inspections = 16

[api.ip]
# internal_mode = false
# filtered_headers = []
# per_ip_per_minute = 60
# per_ip_burst = 10                  # at least 2, the cost of a diff
# per_target_per_minute = 120
# per_target_burst = 20
# batch_max_size = 100               # at most 100
# batch_addresses_per_minute = 60
# batch_addresses_burst = 100        # at least batch_max_size

# The inspector pages' budgets: the job deadline and the jobs in flight per inspector.
[inspect.dns]
# deadline_ms = 30000
# max_concurrent = 8

[inspect.tls]
# deadline_ms = 15000
# max_concurrent = 8

[inspect.http]
# deadline_ms = 30000
# max_concurrent = 8

[inspect.email]
# deadline_ms = 35000                # past the email inspection's own 30 s cap
# max_concurrent = 8

[inspect.ip]
# deadline_ms = 5000
# max_concurrent = 8

[telemetry]
# enabled = false
# otlp_endpoint = "http://localhost:4318"
# service_name = ""
# sample_rate = 1.0
# log_format = "text"                # "text" or "json"

# Each module runs on its defaults when its table is absent. `deadline_ms` is the module's section
# window; the slowest of dns, tls, http and email plus ip must stay below 20000 ms.

# [modules.dns]
# deadline_ms = 2000
# servers = []                       # empty: dns.default_servers

# [modules.dns.dns]
# default_servers = ["google"]
# allow_system_resolvers = true
# allow_arbitrary_servers = false

# [modules.dns.limits]
# per_target_per_minute = 60         # accepted but not read: domain runs are admitted by
# per_target_burst = 20              # [admission], direct DNS jobs by [api.dns]
# max_timeout_secs = 10              # at most 10
# max_servers = 4                    # at most 4

# [modules.dns.circuit_breaker]
# window_secs = 60
# cooldown_secs = 30
# failure_threshold = 0.5            # above 0.0, at most 1.0
# min_requests = 5

# [modules.tls]
# deadline_ms = 2000

# [modules.tls.limits]
# handshake_timeout_secs = 5         # at most 5
# request_timeout_secs = 15          # at most 15
# max_ports = 7                      # at most 7
# max_concurrent_handshakes = 10
# max_ips_per_hostname = 10          # at most 10
# per_target_per_minute = 60
# per_target_burst = 20
# check_budget = 10                  # handshakes one check may spend

# [modules.tls.dns]
# timeout_secs = 3

# [modules.tls.validation]
# expiry_warning_days = 30
# expiry_critical_days = 14
# check_dane = true
# check_caa = true
# check_ct = false
# custom_ca_dir = "/etc/netray/ca"   # unset by default: the built-in roots only

# [modules.tls.quality]
# enabled = true
# http_check_timeout_secs = 5        # at most 5
# skip_http_checks = false

# [modules.http]
# deadline_ms = 2000

# [modules.http.inspect]
# request_timeout_secs = 10
# total_timeout_secs = 30
# max_redirects = 10
# user_agent = "netray-spectra"

# [modules.http.limits]
# per_target_per_minute = 30
# per_target_burst = 10

# [modules.email]
# deadline_ms = 2000

# [modules.email.dns]
# resolvers = ["cloudflare"]
# timeout_ms = 5000

# [modules.email.dnsbl]
# zones = ["zen.spamhaus.org", "b.barracudacentral.org", "bl.spamcop.net", "dbl.spamhaus.org"]
# timeout_ms = 2000
# resolvers = ["system"]             # public DNSBLs refuse queries from open resolvers

# [modules.email.http]
# timeout_ms = 10000

# [modules.email.dkim]
# max_user_selectors = 5

# [modules.email.inspections]
# max_concurrent = 16

# Once [modules.ip] is set it must name geoip_city_db and geoip_asn_db, and a missing file refuses
# startup. Without it the IP section is off. Every data-file key is unset by default; an unset one
# leaves its data out.
# [modules.ip]
# deadline_ms = 2000
# geoip_city_db = "/netray/data/GeoLite2-City.mmdb"
# geoip_asn_db = "/netray/data/GeoLite2-ASN.mmdb"
# user_agent_regexes = "/netray/data/regexes.yaml"
# tor_exit_nodes = "/netray/data/tor_exit_nodes.txt"
# feodo_botnet_ips = "/netray/data/feodo_botnet_ips.txt"
# cins_army_ips = "/netray/data/cins_army_ips.txt"
# cloud_provider_ranges = "/netray/data/cloud_provider_ranges.jsonl"
# vpn_ranges = "/netray/data/vpn_ranges.txt"
# datacenter_ranges = "/netray/data/datacenter_ranges.txt"
# bot_ranges = "/netray/data/bot_ranges.jsonl"
# spamhaus_drop = "/netray/data/spamhaus_drop.txt"
# asn_patterns = "/netray/data/asn_patterns.toml"
# asn_info = "/netray/data/as_metadata.jsonl"
