# crates/lens/tests/fixtures/lens.production.toml translated into netray.toml by the legacy
# table (crates/netray/src/legacy.rs): [backends] to [engine] resolve_timeout_ms and
# [modules.<m>] deadline_ms, [cache] and [rate_limit] into [admission], [scoring] to
# [engine]; [ecosystem], [site] and the modules' enrichment backends are removed.

[server]
bind = "0.0.0.0:8082"
metrics_bind = "0.0.0.0:9090"
trusted_proxies = ["172.31.0.0/24", "172.30.0.0/24"]
apex = "netray.info"

[engine]
resolve_timeout_ms = 1500

[admission]
client_budget_per_hour = 30
domain_run_slots = 8
per_ip_per_minute = 10
per_ip_burst = 3
global_per_minute = 100
global_burst = 20
cache_enabled = true
cache_window_seconds = 300

[telemetry]
log_format = "json"
service_name = "lens"

[modules.dns]
deadline_ms = 15000
servers = ["google"]

[modules.dns.dns]
default_servers = ["google"]
allow_system_resolvers = false

[modules.dns.limits]
max_timeout_secs = 10
max_servers = 4

[modules.tls]
deadline_ms = 15000

[modules.tls.limits]
per_target_per_minute = 60
per_target_burst = 20
max_concurrent_handshakes = 10
max_ports = 5
max_ips_per_hostname = 10
handshake_timeout_secs = 5
request_timeout_secs = 15

[modules.tls.dns]
timeout_secs = 3

[modules.tls.validation]
expiry_warning_days = 30
expiry_critical_days = 14
check_dane = true
check_caa = true
check_ct = true

[modules.tls.quality]
enabled = true
http_check_timeout_secs = 5

[modules.http]
deadline_ms = 15000

[modules.email]
deadline_ms = 15000

[modules.email.dns]
resolvers = ["cloudflare"]
timeout_ms = 5000

[modules.email.dnsbl]
zones = [
  "zen.spamhaus.org",
  "b.barracudacentral.org",
  "bl.spamcop.net",
  "dbl.spamhaus.org",
]
resolvers = ["system"]
timeout_ms = 2000

[modules.email.http]
timeout_ms = 10000

[modules.email.dkim]
max_user_selectors = 5

[modules.ip]
deadline_ms = 2000
geoip_city_db = "/netray/data/GeoLite2-City.mmdb"
geoip_asn_db = "/netray/data/GeoLite2-ASN.mmdb"
tor_exit_nodes = "/netray/data/tor_exit_nodes.txt"
cloud_provider_ranges = "/netray/data/cloud_provider_ranges.jsonl"
feodo_botnet_ips = "/netray/data/feodo_botnet_ips.txt"
vpn_ranges = "/netray/data/vpn_ranges.txt"
datacenter_ranges = "/netray/data/datacenter_ranges.txt"
bot_ranges = "/netray/data/bot_ranges.jsonl"
spamhaus_drop = "/netray/data/spamhaus_drop.txt"
cins_army_ips = "/netray/data/cins_army_ips.txt"
asn_patterns = "/netray/data/asn_patterns.toml"
asn_info = "/netray/data/as_metadata.jsonl"
