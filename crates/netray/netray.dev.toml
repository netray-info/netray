[server]
bind = "127.0.0.1:8082"
metrics_bind = "127.0.0.1:9090"

[store]
db_path = "data/history.db"

[admission]
per_ip_per_minute = 120
per_ip_burst = 30
global_per_minute = 500
global_burst = 100

# A checkout has no data, so there is no [modules.ip] and the IP section is off. To enable it,
# fetch the data with `just ifconfig-data` and name the databases under [modules.ip].
[modules.dns]
deadline_ms = 15000

[modules.tls]
deadline_ms = 15000

[modules.http]
deadline_ms = 15000

[modules.email]
deadline_ms = 15000
