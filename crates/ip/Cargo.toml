[package]
name = "netray-ip"
version.workspace = true
authors = ["Lukas Pustina <lukas@pustina.net>"]

description = "The IP module and inspector of netray: address and network information"
repository = "https://github.com/netray-info/netray"
readme = "README.md"
license = "MIT"
keywords = ["ifconfig", "ip", "network", "webservice"]
edition.workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true, features = ["json"] }
metrics = { workspace = true }
futures = { workspace = true }
mhost = { workspace = true }
netray-engine = { workspace = true }
netray-model = { workspace = true }
netray-common = { workspace = true, features = ["schema", "enrichment"] }
ip_network = { workspace = true }
ip_network_table = "0.2"
lru = "0.18"
maxminddb = "0.27"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
uaparser = "0.6"
utoipa = { workspace = true }

[features]
testing = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1", features = ["json", "yaml", "toml"] }
tracing-subscriber = "0.3"

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

[[test]]
name = "module_v3"
path = "tests/module_v3.rs"
required-features = ["testing"]

[[test]]
name = "contract_status"
path = "tests/contract_status.rs"
required-features = ["testing"]

[[test]]
name = "evidence"
path = "tests/evidence.rs"
required-features = ["testing"]

[[bench]]
name = "negotiation"
harness = false

[[bench]]
name = "asn_heuristic"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "cloud_lookup"
harness = false

