[package]
name = "netray-ip"
version.workspace = true
authors = ["Lukas Pustina <lukas@pustina.net>"]

description = "IP address and network information service"
repository = "https://github.com/lukaspustina/ifconfig-rs"
readme = "Readme.md"
license = "MIT"
keywords = ["ifconfig", "ip", "network", "webservice"]
include = ["Readme.md", "LICENSE", "**/*.rs", "Cargo.toml", "build.rs", "ifconfig.example.toml", "ifconfig.dev.toml", "frontend/dist/**"]
edition.workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true, features = ["json"] }
axum-extra = { workspace = true, features = ["typed-header"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
config = { workspace = true }
futures = { workspace = true }
mhost = { workspace = true }
governor = { workspace = true }
netray-engine = { workspace = true }
netray-model = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "server", "spa", "otel", "cors"] }
httpdate = "1"
ip_network = { workspace = true }
ip_network_table = "0.2"
lru = "0.18"
moka = { workspace = true, features = ["future"] }
maxminddb = "0.27"
notify = "8"
metrics-process = "2.3"
mime_guess = { workspace = true }
regex = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true, features = ["derive"] }
subtle = "2"
serde_json = { workspace = true }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "set-header", "trace", "compression-gzip"] }
tracing = { workspace = true }
uaparser = "0.6"
utoipa = { workspace = true, features = ["axum_extras"] }

[features]
testing = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
http-body-util = { workspace = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
insta = { version = "1", features = ["json", "yaml", "toml"] }
pretty_assertions = "1.4.0"
tower = { workspace = true, features = ["util"] }

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

# Explicit test binary so admin tests always run in their own process.
# The Prometheus metrics recorder is a global singleton; declaring admin as a
# separate [[test]] binary guarantees it gets exactly one installation attempt,
# regardless of how many other test binaries cargo runs in parallel.
[[test]]
name = "admin"
path = "tests/admin.rs"

[[bench]]
name = "negotiation"
harness = false

[[bench]]
name = "asn_heuristic"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "cloud_lookup"
harness = false

