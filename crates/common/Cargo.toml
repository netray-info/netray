[package]
name = "netray-common"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Shared utilities for the netray.info service ecosystem"
repository = "https://github.com/netray-info/netray-common"
homepage = "https://netray.info"
keywords = ["networking", "security", "middleware", "axum"]
categories = ["web-programming::http-server"]
rust-version = "1.88"

[features]
schema = ["dep:utoipa"]
middleware = ["dep:uuid"]
telemetry = ["dep:tracing-subscriber", "dep:tracing-log"]
otel = ["telemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:async-trait", "dep:reqwest", "reqwest/blocking", "dep:tracing-opentelemetry"]
cors = ["dep:tower-http"]
server = ["dep:tokio"]
prometheus = ["server", "dep:metrics-exporter-prometheus"]
spa = ["server", "dep:rust-embed", "dep:mime_guess"]
enrichment = ["dep:reqwest", "dep:futures"]
enrichment-cache = ["enrichment", "dep:moka"]
backend = ["dep:reqwest", "dep:moka", "dep:tokio", "dep:bytes", "dep:thiserror"]
fetch = ["dep:reqwest", "dep:tokio", "dep:url", "dep:thiserror", "dep:bytes"]

[dependencies]
# HTTP framework (for HeaderMap, StatusCode, IntoResponse)
axum = { workspace = true, features = ["json"] }

# Optional: ToSchema derives for ErrorResponse / ErrorInfo
utoipa = { workspace = true, optional = true }

# Optional: UUID v7 for request ID generation (used by middleware feature)
uuid = { workspace = true, features = ["v7"], optional = true }

# Rate limiting
governor = { workspace = true }

# CIDR support for trusted proxy matching
ip_network = { workspace = true }

# Metrics
metrics = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Layered configuration loader
config = { workspace = true }

# Logging
tracing = { workspace = true }

# Optional: tracing-subscriber (telemetry feature)
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"], optional = true }
tracing-log = { version = "0.2", optional = true }

# Optional: tower-http (cors feature)
tower-http = { workspace = true, features = ["cors"], optional = true }

# Optional: OpenTelemetry (otel feature)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace"], optional = true }
opentelemetry-http = { version = "0.31", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

# Optional: tokio (server feature)
tokio = { workspace = true, features = ["signal", "net", "sync"], optional = true }

# Optional: Prometheus metrics server (prometheus feature)
metrics-exporter-prometheus = { workspace = true, optional = true }

# Optional: embedded SPA serving (spa feature)
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

# JSON value type for EcosystemMeta features/limits maps
serde_json = { workspace = true }

# Optional: IP enrichment client (enrichment / enrichment-cache features)
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots"], optional = true }
futures = { workspace = true, optional = true }
moka = { workspace = true, features = ["future"], optional = true }

# Optional: backend client (backend feature)
bytes = { version = "1", optional = true }
thiserror = { workspace = true, optional = true }

# Optional: outbound fetch helper (fetch feature)
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { workspace = true, features = ["util"] }
futures = { workspace = true }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"

[[test]]
name = "fetch"
required-features = ["fetch"]

[[test]]
name = "fetch_semantics"
required-features = ["fetch"]

[[test]]
name = "fetch_reqwest_semantics"
required-features = ["fetch"]

[[test]]
name = "fetch_guards"
required-features = ["fetch"]

[[test]]
name = "fetch_env_proxy"
required-features = ["fetch"]

[[test]]
name = "fetch_traced"
required-features = ["fetch"]
