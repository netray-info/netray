[package]
name = "lens"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Unified domain health check — netray.info"

[dependencies]
# Web framework
axum = { workspace = true, features = ["json"] }
axum-extra = { workspace = true, features = ["typed-header"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment", "backend"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }

# HTTP client (backend calls)
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }

# SSE
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Cache
moka = { workspace = true, features = ["future"] }

# Embedded frontend
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# UUID for request IDs
uuid = { workspace = true, features = ["v7"] }

# Scoring profile
toml = { workspace = true }

# Snapshot storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
nanoid = "0.4"
regex = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock", "std", "oldtime"] }

# OG cards: SVG→PNG rasterization and deterministic ETag hashing
resvg = { version = "0.45", default-features = false, features = ["text"] }
fontdb = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[[test]]
name = "reference_domains"
path = "tests/reference_domains.rs"

[[test]]
name = "scoring_regression"
path = "tests/scoring_regression.rs"

[[test]]
name = "badge_render"
path = "tests/badge_render.rs"

[[test]]
name = "badge_routes"
path = "tests/badge_routes.rs"

[[test]]
name = "sdd_lens_badges_p2_c5_meta_badges"
path = "tests/sdd_lens_badges_p2_c5_meta_badges.rs"

[[test]]
name = "sdd_lens_badges_p1_c11_cache_coalesce"
path = "tests/sdd_lens_badges_p1_c11_cache_coalesce.rs"

[[test]]
name = "og_render"
path = "tests/og_render.rs"

[[test]]
name = "og_routes"
path = "tests/og_routes.rs"

[[test]]
name = "snapshot_store"
path = "tests/snapshot_store.rs"

[[test]]
name = "snapshot_routes"
path = "tests/snapshot_routes.rs"

[[test]]
name = "snapshot_render"
path = "tests/snapshot_render.rs"
