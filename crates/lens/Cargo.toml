[package]
name = "lens"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Unified domain health check — netray.info"

[dependencies]
netray-model = { workspace = true }
netray-engine = { workspace = true }
netray-store = { workspace = true }
netray-web = { workspace = true }
# Web framework
axum = { workspace = true, features = ["json"] }
axum-extra = { workspace = true, features = ["typed-header"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment", "backend"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }

# HTTP client (backend calls)
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }

# SSE
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Cache
moka = { workspace = true, features = ["future"] }

# Embedded frontend
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true, features = ["axum"] }

# UUID for request IDs
uuid = { workspace = true, features = ["v7"] }

# Scoring profile
toml = { workspace = true }

# Snapshot storage
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
nanoid = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock", "std", "oldtime"] }

# OG cards: SVG→PNG rasterization and deterministic ETag hashing
resvg = { version = "0.48", default-features = false, features = ["text"] }
fontdb = "0.24"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
netray-http = { path = "../http", features = ["testing"] }
netray-email = { path = "../email", features = ["testing"] }
netray-ip = { path = "../ip", features = ["testing"] }
netray-tls = { path = "../tls", features = ["testing"] }
netray-dns = { path = "../dns", features = ["testing"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
