[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436); transitive dependency, no
    # drop-in replacement available yet. Tracked for future removal.
    "RUSTSEC-2024-0436",
    # rsa Marvin Attack timing sidechannel (RUSTSEC-2023-0071); transitive via
    # sqlx-mysql, pulled into the lockfile by sqlx's macros/migrate features
    # even though we only use the sqlite backend. No patched rsa release
    # available; the rsa code is never executed at runtime.
    "RUSTSEC-2023-0071",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
