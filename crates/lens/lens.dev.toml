[server]
bind = "127.0.0.1:8085"
metrics_bind = "127.0.0.1:9095"

[backends]
dns_servers = ["cloudflare"]

[backends.dns]
url = "https://dns.netray.info"
timeout_ms = 15000

[backends.tls]
url = "https://tls.netray.info"
timeout_ms = 15000

[backends.ip]
url = "https://ip.netray.info"
timeout_ms = 2000

[backends.http]
timeout_ms = 15000

[modules.http.enrichment]
ip_url = "https://ip.netray.info"

[backends.email]
timeout_ms = 15000

[modules.email.dns]
resolvers = ["1.1.1.1", "1.0.0.1", "8.8.8.8", "8.8.4.4"]
timeout_ms = 5000

[modules.email.dnsbl]
zones = [
  "zen.spamhaus.org",
  "b.barracudacentral.org",
  "bl.spamcop.net",
  "dbl.spamhaus.org",
]
timeout_ms = 2000
resolvers = ["system"]

[modules.email.http]
timeout_ms = 10000

[modules.email.dkim]
max_user_selectors = 5

[modules.email.backends]
ip_url = "https://ip.netray.info"

[ecosystem]
ip_base_url    = "https://ip.netray.info"
dns_base_url   = "https://dns.netray.info"
tls_base_url   = "https://tls.netray.info"
http_base_url  = "https://http.netray.info"
email_base_url = "https://email.netray.info"
lens_base_url  = "https://lens.netray.info"

[snapshots]
db_path = "data/snapshots.db"

[cache]
enabled = true

[rate_limit]
per_ip_per_minute = 120
per_ip_burst = 30
global_per_minute = 500
global_burst = 100
