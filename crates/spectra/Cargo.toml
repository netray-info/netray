[package]
name = "spectra"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "HTTP header inspection and security audit service for netray.info"

[dependencies]
# Web framework
axum = { workspace = true, features = ["json"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "middleware", "telemetry", "otel", "cors", "server", "prometheus", "spa", "enrichment", "fetch"] }

# HTTP client for outbound inspection requests
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots", "http2", "stream"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Ordered maps for header dumps
indexmap = { version = "2", features = ["serde"] }

# Configuration
config = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Embedded frontend
rust-embed = { workspace = true }
mime_guess = { workspace = true }

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }

# Date/time
chrono = { workspace = true, features = ["serde", "clock"] }

# URL parsing
url = { workspace = true }

# Percent-decoding for query params
percent-encoding = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
serde_json = { workspace = true }
