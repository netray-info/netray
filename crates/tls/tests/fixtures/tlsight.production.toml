# Shape of the production config rendered by argus-oci
# (ansible/roles/app_stack/templates/tlsight.toml.j2), with the Jinja variables
# filled in (domain = example.com, group_vars defaults, placeholder subnets).
# Keep in sync with that template.

[server]
bind = "0.0.0.0:8081"
metrics_bind = "0.0.0.0:9090"
trusted_proxies = ["172.31.0.0/24", "172.30.0.0/24"]

[limits]
per_ip_per_minute = 60
per_ip_burst = 10
per_target_per_minute = 60
per_target_burst = 20
max_concurrent_connections = 256
max_concurrent_handshakes = 10
max_ports = 5
max_ips_per_hostname = 10
handshake_timeout_secs = 5
request_timeout_secs = 15

[dns]
timeout_secs = 3

[validation]
expiry_warning_days = 30
expiry_critical_days = 14
check_dane = true
check_caa = true
check_ct = true

[ecosystem]
ip_base_url = "https://ip.example.com"
dns_base_url = "https://dns.example.com"
tls_base_url = "https://tls.example.com"
http_base_url = "https://http.example.com"
email_base_url = "https://email.example.com"
lens_base_url = "https://lens.example.com"

[backends.ip]
url = "http://ifconfig-rs:8000"
timeout_ms = 500
max_concurrent = 20
cache_ttl_secs = 300
cache_capacity = 1024

[quality]
enabled = true
http_check_timeout_secs = 5

[telemetry]
log_format = "json"
service_name = "tlsight"
