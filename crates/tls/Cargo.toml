[package]
name = "netray-tls"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The TLS module and inspector of netray: certificates, handshakes and probes"

[dependencies]
netray-model = { workspace = true }
netray-engine = { workspace = true }
# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "1"
x509-parser = { version = "0.18", features = ["verify"] }
x509-ocsp = "0.2"
x509-cert = "0.2"
spki = "0.7"

# DNS
mhost = { workspace = true }

# Crypto
sha2 = "0.11"
sha1 = "0.11"
der = "0.7"

# Time
time = "0.3"

# Web framework
axum = { workspace = true, features = ["json"] }
governor = { workspace = true }
netray-common = { workspace = true, features = ["schema", "enrichment", "fetch"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }
arc-swap = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging / tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Date/time for cert handling
chrono = { workspace = true, features = ["serde", "clock"] }

# Percent-decoding for URL params
percent-encoding = { workspace = true }

# HTTP client (OCSP)
reqwest = { workspace = true, features = ["json", "rustls", "webpki-roots"] }

[features]
testing = []

[[test]]
name = "module"
path = "tests/module.rs"
required-features = ["testing"]

[[test]]
name = "inspector"
path = "tests/inspector.rs"
required-features = ["testing"]

[dev-dependencies]
toml = { workspace = true }
http-body-util = { workspace = true }
rcgen = "0.14"
serde_json = { workspace = true }
