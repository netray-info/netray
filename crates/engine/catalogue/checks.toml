# The V2 check catalogue (SDD v2 §3.9): one [[check]] table per check ID.
# Severity follows mechanically from the check's profile weight and hard fail: a hard-fail
# check is critical; weight >= 5 is high, 3-4 medium, <= 2 low.

# DNS

[[check]]
id = "dns.dnssec"
protocol = "dns"
title = "DNSSEC signed"
finding = "The zone is not DNSSEC-signed, or its DNSSEC records are inconsistent, use weak algorithms or carry expired signatures."
impact = "Resolvers cannot detect forged or tampered answers for the domain."
fix_hint = "Enable DNSSEC signing at the DNS provider, have its DS record published at the registrar and keep the signatures current."
fix_owner = "dns_provider"
severity = "high"
source = "RFC 4033"
guide = "/guide/dnssec"
short = "DNSSEC"

[[check]]
id = "dns.dnskey_algorithm"
protocol = "dns"
title = "DNSKEY algorithm"
finding = "The zone is signed with a DNSSEC algorithm that is deprecated or not recommended."
impact = "Weak or deprecated algorithms are unsupported by validators or no longer considered safe."
fix_hint = "Re-sign the zone with ECDSA P-256 (algorithm 13) or Ed25519 (algorithm 15)."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 8624"
guide = "/guide/dnssec"
short = "DNSKEY"

[[check]]
id = "dns.dnssec_rollover"
protocol = "dns"
title = "DNSSEC key rollover"
finding = "The DS records at the parent and the zone's KSKs do not match one to one, or the zone publishes more than one KSK."
impact = "A broken rollover can make validating resolvers reject every answer for the domain."
fix_hint = "Retire superseded KSKs from the zone so that one remains, and as part of it remove the DS records of retired keys at the registrar."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 7583"
guide = "/guide/dnssec"
short = "Rollover"

[[check]]
id = "dns.caa"
protocol = "dns"
title = "CAA records"
finding = "The domain publishes no CAA records, sets issue without issuewild, or uses CAA tags other than issue, issuewild and iodef."
impact = "Unrestricted or unclear CAA policy lets any public CA issue certificates, or wildcard certificates, for the domain."
fix_hint = "Publish issue and issuewild CAA records naming the allowed certificate authorities, using only known tags."
fix_owner = "dns_provider"
severity = "high"
source = "RFC 8659"
guide = "/guide/caa-records"
short = "CAA"

[[check]]
id = "dns.ns"
protocol = "dns"
title = "Nameserver redundancy"
finding = "The domain has fewer than two NS records."
impact = "With a single nameserver, its outage takes the whole domain offline."
fix_hint = "Delegate the zone to at least two authoritative nameservers."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 2182"
guide = "/guide/record-types"
short = "NS"

[[check]]
id = "dns.ns_lame"
protocol = "dns"
title = "Lame delegation"
finding = "A nameserver in the zone's NS records answers for the zone without authority, or none of the zone's nameservers can be resolved or reached."
impact = "Resolvers that pick the lame nameserver fail or time out, causing intermittent resolution errors."
fix_hint = "Remove the lame nameserver from the zone's NS records and from the delegation at the registrar."
fix_owner = "dns_provider"
severity = "high"
source = "RFC 1912"
guide = "/guide/lame-delegation"
short = "Lame NS"

[[check]]
id = "dns.ns_delegation"
protocol = "dns"
title = "Delegation consistency"
finding = "The NS records a resolver returns for the domain differ from those served by its authoritative nameservers, which may also disagree with each other."
impact = "Resolvers see different nameserver sets depending on which server they ask, which leads to inconsistent or failing resolution."
fix_hint = "Make every authoritative nameserver serve the same NS set, matching the delegation at the registrar."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 1034"
guide = "/guide/lame-delegation"
short = "Deleg"

[[check]]
id = "dns.cname_apex"
protocol = "dns"
title = "No CNAME at apex"
finding = "The zone apex carries a CNAME record."
impact = "A CNAME at the apex conflicts with the SOA and NS records and breaks mail and other records."
fix_hint = "Replace the apex CNAME with A/AAAA records, or an ALIAS/ANAME record where the provider supports it."
fix_owner = "dns_provider"
severity = "high"
source = "RFC 1034"
guide = "/guide/record-types"
short = "Apex"

[[check]]
id = "dns.https_svcb"
protocol = "dns"
title = "HTTPS record"
finding = "The domain publishes no HTTPS or SVCB record, or its records mix alias and service mode or hold several alias records."
impact = "Clients cannot reliably learn HTTP/2, HTTP/3 or ECH support before connecting, which costs round trips."
fix_hint = "Publish either one alias-mode or only service-mode HTTPS records that advertise the supported ALPN protocols."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 9460"
guide = "/guide/record-types"
short = "HTTPS RR"

[[check]]
id = "dns.ttl"
protocol = "dns"
title = "TTL range"
finding = "Records have TTLs below 60 seconds, NS or MX records have TTLs above one week, or the SOA minimum exceeds one day."
impact = "Very low TTLs load resolvers, while very high NS, MX or negative-caching TTLs delay the propagation of changes."
fix_hint = "Keep TTLs at 60 seconds or more, NS and MX TTLs at one week or less, and the SOA minimum at one day or less."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 1912"
guide = "/guide/record-types"
short = "TTL"

# TLS

[[check]]
id = "tls.tls_reachable"
protocol = "tls"
title = "TLS reachable"
finding = "No address of the domain completed a TLS handshake on port 443."
impact = "Visitors cannot reach the site over HTTPS at all."
fix_hint = "Serve HTTPS on port 443 and allow inbound connections to it through the firewall."
fix_owner = "hosting"
severity = "critical"
source = "RFC 8446"
guide = "/guide/tls-protocol"
short = "Reach"

[[check]]
id = "tls.chain_trusted"
protocol = "tls"
title = "Chain trusted"
finding = "The served certificate chain does not build to a trust anchor in the public trust stores."
impact = "Browsers show a security warning and block the site."
fix_hint = "Install a certificate from a public CA together with its full intermediate chain."
fix_owner = "web_server"
severity = "critical"
source = "RFC 5280"
guide = "/guide/certificate-chain"
short = "Trust"

[[check]]
id = "tls.not_expired"
protocol = "tls"
title = "Certificate valid"
finding = "A certificate in the served chain has expired or is not yet valid."
impact = "Browsers block access to the site until the certificate is replaced."
fix_hint = "Renew the leaf certificate and remove expired intermediates and cross-signs from the chain the server sends."
fix_owner = "web_server"
severity = "critical"
source = "RFC 5280"
guide = "/guide/certificate-chain"
short = "Expired"

[[check]]
id = "tls.hostname_match"
protocol = "tls"
title = "Hostname match"
finding = "The certificate's Subject Alternative Names do not cover the hostname."
impact = "Browsers reject the connection with a name mismatch error."
fix_hint = "Reissue the certificate with every hostname served on this server in its SAN list."
fix_owner = "certificate_provider"
severity = "high"
source = "RFC 9525"
guide = "/guide/certificate-chain"
short = "Hostname"

[[check]]
id = "tls.chain_complete"
protocol = "tls"
title = "Chain complete"
finding = "The server's chain is missing an intermediate, including a leaf sent alone, or sends its certificates out of order."
impact = "Clients that do not reorder the chain or fetch missing intermediates fail to validate the certificate."
fix_hint = "Configure the server to send the leaf followed by every intermediate in issuing order."
fix_owner = "web_server"
severity = "high"
source = "RFC 8446"
guide = "/guide/certificate-chain"
short = "Chain"

[[check]]
id = "tls.strong_signature"
protocol = "tls"
title = "Strong signature"
finding = "The leaf or an intermediate certificate is signed with SHA-1 or MD5, while root self-signatures are ignored."
impact = "Weak signatures can be forged and are rejected by modern browsers."
fix_hint = "Replace the affected certificates with ones signed using SHA-256 or stronger."
fix_owner = "certificate_provider"
severity = "high"
source = "CA/Browser Forum Baseline Requirements"
guide = "/guide/certificate-chain"
short = "Sig"

[[check]]
id = "tls.key_strength"
protocol = "tls"
title = "Key strength"
finding = "A certificate in the chain has a key shorter than 2048-bit RSA or 256-bit ECDSA."
impact = "Short keys can be broken and are refused by modern clients."
fix_hint = "Reissue the certificate with at least a 2048-bit RSA or a 256-bit ECDSA key from a CA whose intermediates meet the same minimum."
fix_owner = "certificate_provider"
severity = "high"
source = "CA/Browser Forum Baseline Requirements"
guide = "/guide/certificate-chain"
short = "Key"

[[check]]
id = "tls.expiry_window"
protocol = "tls"
title = "Expiry window"
finding = "A certificate in the chain expires within 30 days."
impact = "Without renewal, browsers start blocking the site when it expires."
fix_hint = "Renew the certificate now and automate future renewals."
fix_owner = "certificate_provider"
severity = "high"
source = "RFC 5280"
guide = "/guide/certificate-management"
short = "Renewal"

[[check]]
id = "tls.cert_lifetime"
protocol = "tls"
title = "Certificate lifetime"
finding = "The leaf certificate's validity period is longer than 398 days."
impact = "Major browsers reject publicly-trusted certificates issued with a longer lifetime."
fix_hint = "Reissue the certificate with a lifetime of 398 days or less."
fix_owner = "certificate_provider"
severity = "medium"
source = "CA/Browser Forum Baseline Requirements"
guide = "/guide/certificate-management"
short = "Lifetime"

[[check]]
id = "tls.san_quality"
protocol = "tls"
title = "SAN quality"
finding = "The leaf certificate lists 100 or more SANs, or contains internal names such as single-label hostnames or RFC 1918 addresses."
impact = "Internal names disclose private infrastructure, and very large SAN lists share one key across many sites."
fix_hint = "Reissue the certificate with public hostnames only and split very large SAN lists across several certificates."
fix_owner = "certificate_provider"
severity = "low"
source = "RFC 9525"
guide = "/guide/certificate-management"
short = "SAN"

[[check]]
id = "tls.aia_reachability"
protocol = "tls"
title = "AIA reachable"
finding = "The served chain is incomplete, so clients must fetch missing intermediates via the certificate's caIssuers URL, or no such URL exists."
impact = "Clients that do not follow AIA, and every client when no caIssuers URL exists, fail to validate the certificate."
fix_hint = "Configure the server to send the full chain, leaf plus all intermediates."
fix_owner = "web_server"
severity = "low"
source = "RFC 5280"
guide = "/guide/certificate-management"
short = "AIA"

[[check]]
id = "tls.tls_version"
protocol = "tls"
title = "TLS version"
finding = "The server does not negotiate TLS 1.3."
impact = "TLS 1.2 lacks the encrypted handshake and fixed safe cipher suites of TLS 1.3 and stays safe only with careful configuration."
fix_hint = "Enable TLS 1.3 in the server's TLS configuration."
fix_owner = "web_server"
severity = "high"
source = "RFC 8446"
guide = "/guide/tls-protocol"
short = "Version"

[[check]]
id = "tls.forward_secrecy"
protocol = "tls"
title = "Forward secrecy"
finding = "The negotiated cipher suite provides no forward secrecy."
impact = "A later compromise of the private key exposes recorded past sessions."
fix_hint = "Prefer ECDHE cipher suites in the server's TLS configuration."
fix_owner = "web_server"
severity = "high"
source = "RFC 9325"
guide = "/guide/tls-protocol"
short = "PFS"

[[check]]
id = "tls.aead_cipher"
protocol = "tls"
title = "AEAD cipher"
finding = "The negotiated cipher suite is not an AEAD suite such as AES-GCM or ChaCha20-Poly1305."
impact = "Legacy cipher modes are vulnerable to padding-oracle and related attacks."
fix_hint = "Allow only AEAD ciphers such as AES-GCM and ChaCha20-Poly1305."
fix_owner = "web_server"
severity = "high"
source = "RFC 9325"
guide = "/guide/tls-protocol"
short = "AEAD"

[[check]]
id = "tls.ocsp_stapled"
protocol = "tls"
title = "OCSP stapling"
finding = "The server does not staple an OCSP response to the handshake."
impact = "Clients must contact the CA to check revocation, which costs latency and leaks browsing."
fix_hint = "Enable OCSP stapling in the server's TLS configuration."
fix_owner = "web_server"
severity = "medium"
source = "RFC 6066"
guide = "/guide/certificate-chain"
short = "OCSP"

[[check]]
id = "tls.ct_logged"
protocol = "tls"
title = "CT logged"
finding = "The certificate embeds fewer than two Signed Certificate Timestamps."
impact = "Browsers that enforce a Certificate Transparency policy may reject certificates with too few SCTs."
fix_hint = "Obtain a certificate from a CA that embeds SCTs from at least two Certificate Transparency logs."
fix_owner = "certificate_provider"
severity = "medium"
source = "RFC 6962"
guide = "/guide/certificate-transparency"
short = "CT"

[[check]]
id = "tls.caa_compliant"
protocol = "tls"
title = "CAA compliant"
finding = "The domain publishes CAA records and none authorises the issuing CA, or a CAA record with an unknown tag carries the critical flag."
impact = "Issuance outside the CAA policy points to mis-issuance or a stale policy, and an unknown critical tag forbids every CA from issuing."
fix_hint = "Authorise the issuing CA in the CAA records or reissue from a CA they already allow, and drop the critical flag from records with unknown tags."
fix_owner = "dns_provider"
severity = "high"
source = "RFC 8659"
guide = "/guide/caa-records"
short = "CAA ok"

[[check]]
id = "tls.dane_valid"
protocol = "tls"
title = "DANE valid"
finding = "The TLSA records at _443._tcp match neither the served certificate nor its key."
impact = "DANE-validating clients refuse the connection."
fix_hint = "Update the TLSA record to match the current certificate or key on every rotation."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 6698"
guide = "/guide/dane-tlsa"
short = "DANE"

[[check]]
id = "tls.consistency"
protocol = "tls"
title = "Multi-IP consistency"
finding = "The domain's addresses serve different certificates or TLS configurations."
impact = "Visitors get different security depending on which address they reach."
fix_hint = "Serve the same certificate and TLS configuration on every address of the domain."
fix_owner = "hosting"
severity = "medium"
source = "RFC 9325"
guide = "/guide/multi-ip-tls"
short = "Consist"

[[check]]
id = "tls.alpn_consistency"
protocol = "tls"
title = "ALPN consistency"
finding = "The domain's addresses advertise different ALPN protocols."
impact = "Clients see HTTP/2 on some connections and not on others, which makes behaviour unpredictable."
fix_hint = "Align the ALPN configuration across all servers behind the domain."
fix_owner = "hosting"
severity = "low"
source = "RFC 7301"
guide = "/guide/multi-ip-tls"
short = "ALPN"

[[check]]
id = "tls.ech_advertised"
protocol = "tls"
title = "ECH advertised"
finding = "The domain's HTTPS record advertises no Encrypted Client Hello configuration."
impact = "The requested hostname travels in clear text and is visible to network observers."
fix_hint = "Publish the server's ECH configuration in the ech= parameter of the HTTPS record, once Encrypted Client Hello is enabled on the server."
fix_owner = "dns_provider"
severity = "low"
source = "draft-ietf-tls-esni"
guide = "/guide/encrypted-client-hello"
short = "ECH"

# HTTP

[[check]]
id = "http.https_redirect"
protocol = "http"
title = "HTTPS redirect"
finding = "Port 80 is closed, or plain HTTP requests on it are not redirected to HTTPS."
impact = "Visitors who type the bare domain get no upgrade to HTTPS and either fail to connect or stay on an unencrypted, tamperable connection."
fix_hint = "Serve HTTP on port 80 and redirect every request to HTTPS with a 301 before serving content."
fix_owner = "web_server"
severity = "high"
source = "RFC 9110"
guide = "/guide/hsts"
short = "Redirect"

[[check]]
id = "http.hsts"
protocol = "http"
title = "HSTS"
finding = "HTTPS responses carry no Strict-Transport-Security header, or one with a max-age below one year."
impact = "Browsers may fall back to HTTP, which leaves visitors open to SSL stripping."
fix_hint = "Send Strict-Transport-Security with max-age=31536000 on all HTTPS responses."
fix_owner = "web_server"
severity = "high"
source = "RFC 6797"
guide = "/guide/hsts"
short = "HSTS"

[[check]]
id = "http.cors"
protocol = "http"
title = "CORS policy"
finding = "The site echoes an untrusted request Origin in Access-Control-Allow-Origin together with Access-Control-Allow-Credentials: true, or allows any origin with Access-Control-Allow-Origin: *."
impact = "Other sites can read responses, in the reflected case with the visitor's credentials."
fix_hint = "Allow only an explicit list of trusted origins and send Access-Control-Allow-Credentials only for those."
fix_owner = "web_server"
severity = "medium"
source = "WHATWG Fetch Standard"
guide = "/guide/cors"
short = "CORS"

[[check]]
id = "http.cookie_secure"
protocol = "http"
title = "Secure cookies"
finding = "Cookies are set without the Secure flag."
impact = "Such cookies are also sent over plain HTTP, where they can be intercepted."
fix_hint = "Set the Secure flag on every cookie."
fix_owner = "web_server"
severity = "low"
source = "RFC 6265"
guide = "/guide/cookie-security"
short = "Cookies"

[[check]]
id = "http.csp"
protocol = "http"
title = "Content Security Policy"
finding = "Responses carry no enforced Content-Security-Policy, or one without default-src or with permissive sources such as 'unsafe-inline'."
impact = "Injected scripts run unrestricted, which makes cross-site scripting easier to exploit."
fix_hint = "Send an enforced Content-Security-Policy with default-src, object-src 'none' and base-uri that restricts scripts to trusted origins."
fix_owner = "web_server"
severity = "low"
source = "W3C Content Security Policy Level 3"
guide = "/guide/csp"
short = "CSP"

[[check]]
id = "http.x_frame_options"
protocol = "http"
title = "X-Frame-Options"
finding = "Responses carry no X-Frame-Options header with the value DENY or SAMEORIGIN."
impact = "Other sites can embed the page in a frame, which enables clickjacking."
fix_hint = "Send X-Frame-Options: DENY, or SAMEORIGIN where the site frames its own pages."
fix_owner = "web_server"
severity = "low"
source = "RFC 7034"
guide = "/guide/security-headers"
short = "XFO"

[[check]]
id = "http.x_content_type_options"
protocol = "http"
title = "X-Content-Type-Options"
finding = "Responses carry no X-Content-Type-Options header with the value nosniff."
impact = "Browsers may sniff content types and execute uploaded files as scripts."
fix_hint = "Send X-Content-Type-Options: nosniff on all responses."
fix_owner = "web_server"
severity = "low"
source = "WHATWG Fetch Standard"
guide = "/guide/security-headers"
short = "XCTO"

[[check]]
id = "http.referrer_policy"
protocol = "http"
title = "Referrer-Policy"
finding = "Responses carry no Referrer-Policy header, or one set to origin, origin-when-cross-origin, unsafe-url or an unrecognised value."
impact = "Permissive policies send the page's origin or full URL, including paths and query strings, to other sites."
fix_hint = "Send Referrer-Policy: strict-origin-when-cross-origin or stricter."
fix_owner = "web_server"
severity = "low"
source = "W3C Referrer Policy"
guide = "/guide/security-headers"
short = "Referrer"

[[check]]
id = "http.permissions_policy"
protocol = "http"
title = "Permissions-Policy"
finding = "Responses carry no Permissions-Policy header."
impact = "Embedded content may use browser features such as camera or geolocation without restriction."
fix_hint = "Send a Permissions-Policy that disables the browser features the site does not use."
fix_owner = "web_server"
severity = "low"
source = "W3C Permissions Policy"
guide = "/guide/security-headers"
short = "Perms"

[[check]]
id = "http.deprecated_headers"
protocol = "http"
title = "Deprecated headers"
finding = "Responses carry deprecated security headers: X-XSS-Protection, Expect-CT or Public-Key-Pins."
impact = "Deprecated headers have no protective effect and some reintroduce vulnerabilities in old browsers."
fix_hint = "Remove deprecated security headers from the server's responses."
fix_owner = "web_server"
severity = "low"
source = "OWASP Secure Headers Project"
guide = "/guide/http-redirects"
short = "Legacy"

[[check]]
id = "http.info_leakage"
protocol = "http"
title = "Information leakage"
finding = "Responses carry headers that disclose server software or internals, such as Server, X-Powered-By, Via or X-AspNet-Version."
impact = "Software names and versions help attackers target known vulnerabilities."
fix_hint = "Remove the Server, X-Powered-By and similar technology headers from the server's responses."
fix_owner = "web_server"
severity = "low"
source = "RFC 9110"
guide = "/guide/http-redirects"
short = "Leakage"

[[check]]
id = "http.caching"
protocol = "http"
title = "Cache control"
finding = "Responses carry no Cache-Control header, or max-age=0 without no-cache or must-revalidate."
impact = "Browsers and shared caches then fall back to their own heuristics and may serve stale content."
fix_hint = "Send an explicit Cache-Control header on each response and pair max-age=0 with no-cache or must-revalidate."
fix_owner = "web_server"
severity = "low"
source = "RFC 9111"
guide = "/guide/http-redirects"
short = "Caching"

# Email

[[check]]
id = "email.mx"
protocol = "email"
title = "MX records"
finding = "An MX record points to a CNAME or to a host without A or AAAA records, or all mail goes to a single server or network block."
impact = "Mail delivery breaks, or fails entirely when the single server or network is down."
fix_hint = "Point MX records at hostnames with their own A or AAAA records, spread over at least two servers in separate networks."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 5321"
guide = "/guide/email-deliverability"
short = "MX"

[[check]]
id = "email.spf"
protocol = "email"
title = "SPF"
finding = "The domain's SPF record is missing or invalid, leaves out the addresses of self-hosted MX hosts, or lacks -all although the domain publishes a Null MX."
impact = "Others can send mail in the domain's name, and legitimate mail may be rejected."
fix_hint = "Publish one SPF record that lists every server sending mail for the domain, including self-hosted MX hosts that also send, and ends in -all, or ~all where the domain does not publish a Null MX."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 7208"
guide = "/guide/email-auth"
short = "SPF"

[[check]]
id = "email.dkim"
protocol = "email"
title = "DKIM"
finding = "A DKIM key for the domain is an RSA key shorter than 2048 bits, only revoked keys are published, a selector's CNAME chain is deeper than five hops, or no key is found on the probed selectors while DMARC is p=reject and SPF ends in -all."
impact = "Receivers treat signatures from short keys as weak or invalid, and without DKIM a strict DMARC policy rejects the domain's mail whenever SPF fails, such as after forwarding."
fix_hint = "Rotate to a 2048-bit RSA or an Ed25519 DKIM key at the mail provider, publish it at the selector and sign all outgoing mail with it."
fix_owner = "mail_provider"
severity = "medium"
source = "RFC 6376"
guide = "/guide/dkim"
short = "DKIM"

[[check]]
id = "email.dmarc"
protocol = "email"
title = "DMARC"
finding = "The domain's DMARC record is missing, duplicated or invalid, its policy is p=none or p=quarantine, it sets pct=0 or pairs p=reject with sp=none, or its report addresses are missing or unauthorised."
impact = "Receivers are not told to reject spoofed mail claiming to come from the domain or its subdomains."
fix_hint = "Publish one DMARC record with p=reject, without sp=none or pct=0, and with an rua address authorised to receive reports."
fix_owner = "dns_provider"
severity = "medium"
source = "RFC 7489"
guide = "/guide/email-auth"
short = "DMARC"

[[check]]
id = "email.mta_sts"
protocol = "email"
title = "MTA-STS"
finding = "The MTA-STS policy cannot be fetched or is invalid, runs in mode testing or none, does not cover every MX host, or sets a max_age below one day."
impact = "Sending servers may deliver mail over unencrypted or downgraded SMTP connections."
fix_hint = "Serve a valid MTA-STS policy from the mta-sts web host in mode enforce, listing every MX host with a max_age of at least one day, and update the id in the _mta-sts TXT record on every change."
fix_owner = "hosting"
severity = "low"
source = "RFC 8461"
guide = "/guide/mta-sts"
short = "MTA-STS"

[[check]]
id = "email.tls_rpt"
protocol = "email"
title = "TLS-RPT"
finding = "The TLS-RPT record is malformed or has no valid mailto: or https: rua address, or MTA-STS or DANE is deployed without one."
impact = "Delivery failures caused by MTA-STS or DANE problems go unnoticed."
fix_hint = "Publish a _smtp._tls TXT record with v=TLSRPTv1 and a mailto: or https: rua address."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 8460"
guide = "/guide/tls-rpt"
short = "TLS-RPT"

[[check]]
id = "email.bimi"
protocol = "email"
title = "BIMI"
finding = "The BIMI logo URL does not use HTTPS or does not load, or the DMARC policy is too weak for BIMI."
impact = "Supporting mail clients do not show the brand logo next to the domain's mail."
fix_hint = "Serve the BIMI logo over HTTPS at a reachable URL and set DMARC to p=quarantine or p=reject."
fix_owner = "hosting"
severity = "low"
source = "draft-brand-indicators-for-message-identification"
guide = "/guide/bimi"
short = "BIMI"

[[check]]
id = "email.dane"
protocol = "email"
title = "SMTP DANE"
finding = "A TLSA record at _25._tcp of an MX host has an out-of-range usage, selector or matching type, or the mail domain's own zone is not DNSSEC-signed."
impact = "Sending servers cannot authenticate the MX hosts and may deliver over intercepted connections."
fix_hint = "Sign the domain's zone with DNSSEC and keep the TLSA records at _25._tcp of every MX host within the valid usage, selector and matching-type values."
fix_owner = "dns_provider"
severity = "low"
source = "RFC 7672"
guide = "/guide/dane-tlsa"
short = "MX DANE"

[[check]]
id = "email.dnsbl"
protocol = "email"
title = "DNS blocklists"
finding = "An MX address or the domain is listed on a DNS blocklist."
impact = "Receivers that consult the blocklist reject or quarantine the domain's mail."
fix_hint = "Stop the activity that caused the listing, then request delisting from each blocklist."
fix_owner = "mail_provider"
severity = "low"
source = "RFC 5782"
guide = "/guide/dnsbl"
short = "DNSBL"

[[check]]
id = "email.fcrdns"
protocol = "email"
title = "Forward-confirmed rDNS"
finding = "An MX address has no PTR record, or its PTR name does not resolve back to the address."
impact = "Many receivers reject or penalise mail from servers without forward-confirmed reverse DNS."
fix_hint = "Set a PTR record for each mail server address that resolves back to the same address."
fix_owner = "hosting"
severity = "low"
source = "RFC 1912"
guide = "/guide/dnsbl"
short = "FCrDNS"

# IP

[[check]]
id = "ip.reputation"
protocol = "ip"
title = "IP reputation"
finding = "An address of the domain is listed by Spamhaus, flagged as a Tor exit node or a command-and-control server, or flagged as a VPN endpoint."
impact = "Flagged addresses are blocked or throttled by mail receivers, firewalls and CDNs."
fix_hint = "Investigate the flagged address, request delisting where the source offers it, or stop using the address for the service."
fix_owner = "hosting"
severity = "high"
source = "RFC 5782"
guide = "/guide/ip-enrichment"
short = "Rep"
